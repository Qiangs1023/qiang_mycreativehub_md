<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — 页面不存在 · 数字旷野</title>
    <meta name="description" content="这个页面不存在。回到首页，或从「从零开始」找到你想看的文章、作品、视频和课程。" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #16150f;
        --fg: #f2efe7;
        --muted: #9a958a;
        --primary: #4ade80;
        --line: #34322a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
        padding: 32px 20px;
      }
      .wrap { max-width: 560px; width: 100%; }
      .code {
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 13px;
        color: var(--primary);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        font-family: "Songti SC", "Noto Serif CJK SC", Georgia, serif;
        font-size: 40px;
        font-weight: 300;
        line-height: 1.15;
        margin: 12px 0 0;
      }
      p { color: var(--muted); font-size: 15px; margin: 16px 0 0; }
      .links {
        margin-top: 36px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .links a {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 18px;
        font-size: 14px;
        color: var(--fg);
        text-decoration: none;
        transition: border-color 0.2s, color 0.2s;
      }
      .links a:hover { border-color: var(--primary); color: var(--primary); }
      .links a.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #16210f;
        font-weight: 600;
      }
      .links a.primary:hover { color: #16210f; opacity: 0.88; }
      footer {
        margin-top: 48px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-family: "SF Mono", ui-monospace, Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404 · Not Found</div>
      <h1>这个页面不存在</h1>
      <p>
        链接可能已经失效，或者地址拼错了。下面几个入口应该能帮你找到要找的东西。
      </p>
      <div class="links">
        <a class="primary" href="/">回到首页</a>
        <a href="/start-here">从零开始</a>
        <a href="/writing">写作</a>
        <a href="/work">作品</a>
        <a href="/courses">课程</a>
      </div>
      <footer>数字旷野 · digiwild.cc</footer>
    </div>
  </body>
</html>
