name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 注意：不要再用 `cp dist/client/index.html dist/client/404.html` 做 SPA fallback。
      # 那样未知路径会拿到一份首页 HTML —— 即使状态码是 404，搜索引擎仍会判定为
      # 「重复内容 / 软 404」，白白稀释首页权重。
      # public/404.html 已经是真正的 404 页，Vite 构建时会原样复制到 dist/client/。

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4